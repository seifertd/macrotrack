upstream macrotrack {
  server localhost:4001 max_fails=1 fail_timeout=30s;
}

server {
  server_name macros.dseifert.net;
  root /home/doug/webapps/macrotrack/production/current/public;

  # Voice uploads: the 1M default truncates anything past a short clip.
  client_max_body_size 25M;

  access_log  /var/log/nginx/macrotrack_access.log  apps;

  location ~ ^/assets/ {
    expires 1y;
    add_header Cache-Control public;
    add_header Access-Control-Allow-Origin *;
    add_header ETag "";
    break;
  }

  # The service worker must never be served stale, or an old shell pins itself.
  location = /sw.js {
    expires off;
    add_header Cache-Control "no-cache";
    proxy_pass http://macrotrack;
  }

  location /cable {
    proxy_pass http://macrotrack;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Host $http_host;
    proxy_read_timeout 3600s;
  }

  location / {
    proxy_pass http://macrotrack;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header Host $http_host;
    proxy_read_timeout 120s;
  }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/macros.dseifert.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/macros.dseifert.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = macros.dseifert.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  server_name macros.dseifert.net;
    return 404; # managed by Certbot


}